<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Ghostnotes</title>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="i-chevron-left" viewBox="0 0 16 16"><path d="m10 3-5 5 5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></symbol>
        <symbol id="i-chevron-right" viewBox="0 0 16 16"><path d="m6 3 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></symbol>
        <symbol id="i-loop" viewBox="0 0 16 16"><path d="M3 5h9l-2-2m3 8H4l2 2M12 5a4 4 0 0 1 1 5M4 11a4 4 0 0 1-1-5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /></symbol>
        <symbol id="i-play" viewBox="0 0 16 16"><path d="M4.5 2.8v10.4L13 8z" fill="currentColor" /></symbol>
        <symbol id="i-stop" viewBox="0 0 16 16"><rect x="3.5" y="3.5" width="9" height="9" rx="1.2" fill="currentColor" /></symbol>
        <symbol id="i-start" viewBox="0 0 16 16"><path d="M3.5 3v10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" /><path d="M13 3.2v9.6L5.8 8z" fill="currentColor" /></symbol>
        <symbol id="i-undo" viewBox="0 0 16 16"><path d="M5.5 4 2.5 7l3 3M3 7h6.5a3.5 3.5 0 0 1 0 7H7" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" /></symbol>
        <symbol id="i-redo" viewBox="0 0 16 16"><path d="M10.5 4l3 3-3 3M13 7H6.5a3.5 3.5 0 0 0 0 7H9" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" /></symbol>
        <symbol id="i-gear" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.5" /><path d="M8 1.8v1.6M8 12.6v1.6M1.8 8h1.6M12.6 8h1.6M3.6 3.6l1.1 1.1M11.3 11.3l1.1 1.1M3.6 12.4l1.1-1.1M11.3 4.7l1.1-1.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" /></symbol>
        <symbol id="i-spark" viewBox="0 0 16 16"><path d="M8 1.5l1.5 4.2 4.2 1.5-4.2 1.5L8 12.9 6.5 8.7 2.3 7.2l4.2-1.5z" fill="currentColor" /><path d="M13 11.5l.6 1.4 1.4.6-1.4.6-.6 1.4-.6-1.4-1.4-.6 1.4-.6z" fill="currentColor" /></symbol>
        <symbol id="i-speaker" viewBox="0 0 16 16"><path d="M2.5 6h2.3L8 3.3v9.4L4.8 10H2.5z" fill="currentColor" /><path d="M10.5 5.5a3.5 3.5 0 0 1 0 5M12.3 3.8a6 6 0 0 1 0 8.4" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" /></symbol>
        <symbol id="i-check" viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" /></symbol>
        <symbol id="i-down" viewBox="0 0 16 16"><path d="M8 2.5v8M4.5 7.5 8 11l3.5-3.5M3 13.5h10" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" /></symbol>
      </defs>
    </svg>

    <div class="app">
      <header class="transport" aria-label="トランスポート">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="9" height="4" rx="1.5" fill="currentColor" /><rect x="10" y="14" width="11" height="4" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2.4 1.8" /></svg>
          <span>Ghostnotes</span>
        </div>

        <div class="t-group" role="group" aria-label="再生">
          <button id="toStart" class="icon-btn" title="先頭に戻る（Home）" aria-label="先頭に戻る"><svg><use href="#i-start" /></svg></button>
          <button id="play" class="icon-btn play" title="再生／停止（Space）" aria-label="再生"><svg><use href="#i-play" /></svg></button>
        </div>

        <output id="position" class="lcd" aria-label="再生位置（小節.拍.16分）">1.1.1</output>

        <div class="t-group fields">
          <label class="t-field"><span>BPM</span><input id="bpm" type="number" min="60" max="200" inputmode="numeric" /></label>
          <label class="t-field"><span>キー</span><select id="key"></select></label>
        </div>
        <button id="loop" class="text-btn" aria-pressed="false" title="曲の内容がある範囲を繰り返す">ループ</button>

        <div class="seg" role="group" aria-label="聴くもの">
          <button data-mode="A" title="自分のノートだけを鳴らす">ノート</button>
          <button data-mode="B" title="提案（ゴースト）も MIDI で重ねて鳴らす">提案</button>
          <button data-mode="L" title="Lyria が弾いた原音を重ねて鳴らす">原音</button>
        </div>

        <div class="t-group push" role="group" aria-label="編集の履歴">
          <button id="undo" class="icon-btn" title="元に戻す（Cmd/Ctrl+Z）" aria-label="元に戻す"><svg><use href="#i-undo" /></svg></button>
          <button id="redo" class="icon-btn" title="やり直す（Shift+Cmd+Z / Ctrl+Y）" aria-label="やり直す"><svg><use href="#i-redo" /></svg></button>
        </div>
        <div class="t-group" role="group" aria-label="書き出し">
          <button id="exportMidi" class="text-btn" title="採用済みの音を .mid にする（手元の DAW で続きを作れる）"><svg><use href="#i-down" /></svg>MIDI</button>
          <button id="exportWav" class="text-btn" title="採用済みの音を 2 ループぶん .wav にする"><svg><use href="#i-down" /></svg>WAV</button>
        </div>
        <details class="settings">
          <summary aria-label="設定" title="設定"><svg><use href="#i-gear" /></svg></summary>
          <div class="settings-body">
            <label class="stack">Gemini API キー<input id="apiKey" type="password" autocomplete="off" /></label>
            <label class="stack">耳コピ<select id="transcriber"><option value="a100">MuScriptor medium（A100）</option><option value="cpu">MuScriptor（CPU）</option><option value="browser">Basic Pitch（補助）</option></select></label>
            <label class="check"><input id="monitor" type="checkbox" /> 原音を自動再生</label>
            <a href="/compare/">試聴比較</a>
            <a href="/soundfonts/LICENSE-MuseScore-General.txt" target="_blank" rel="noopener">音源: MuseScore General</a>
            <button id="reset" class="text-btn">曲を空にする</button>
          </div>
        </details>
      </header>

      <nav class="mobile-panels" aria-label="作業パネル">
        <button data-pane="tracks" aria-pressed="false" aria-controls="tracksPane">トラック</button>
        <button data-pane="editor" aria-pressed="true" aria-controls="editorPane">編集</button>
        <button data-pane="generate" aria-pressed="false" aria-controls="generatorPane">生成</button>
      </nav>
      <div class="workspace" data-mobile-pane="editor">
        <aside id="tracksPane" class="tracks-pane" aria-label="トラック">
          <div class="pane-head">トラック</div>
          <div id="tracks" class="tracks"></div>
        </aside>

        <main id="editorPane" class="editor" aria-label="エディタ">
          <div class="editor-head">
            <h1 id="rollTitle"></h1>
            <span id="rollMeta" class="hint"></span>
            <span class="legend" aria-hidden="true">
              <span class="lg lg-note"></span>自分の音
              <span class="lg lg-ghost"></span>提案
              
            </span>
          </div>
          <div class="edit-tools" aria-label="編集範囲とグリッド">
            <div class="view-navigation">
              <button id="viewPrev" class="icon-btn" aria-label="前の小節へ" title="前へ"><svg><use href="#i-chevron-left" /></svg></button>
              <label><span class="sr-only">表示開始の小節</span><input id="viewStart" type="number" min="1" value="1" aria-label="表示開始の小節" /></label>
              <button id="viewNext" class="icon-btn" aria-label="次の小節へ" title="次へ"><svg><use href="#i-chevron-right" /></svg></button>
            </div>
            <label>ズーム<select id="viewBars"><option value="1">1小節</option><option value="2">2小節</option><option value="4" selected>4小節</option><option value="8">8小節</option><option value="16">16小節</option></select></label>
            <label>グリッド<select id="grid"><option value="4">1/4</option><option value="2">1/8</option><option value="1">1/16</option><option value="0.5">1/32</option><option value="0.25" selected>1/64</option><option value="0.125">1/128</option><option value="1.3333333333333333">1/8 三連</option><option value="0.6666666666666666">1/16 三連</option><option value="0.3333333333333333">1/32 三連</option><option value="0">自由</option></select></label>
            <button id="playView" class="icon-btn" aria-label="表示範囲をループ" title="表示範囲をループ"><svg><use href="#i-loop" /></svg></button>
            <input id="timeline" type="range" min="0" max="0" value="0" aria-label="曲内の表示位置" />
          </div>
          <div id="takes" class="takes" hidden></div>
          <div class="roll-wrap"><canvas id="roll" aria-label="ピアノロール"></canvas></div>
          <div class="vel-wrap"><canvas id="vel" aria-label="ベロシティ（音の強さ）"></canvas></div>
        </main>

        <aside id="generatorPane" class="inspector" aria-label="提案">
          <section class="panel generation-panel">
            <h2>生成</h2>
            <div class="control-pair">
              <label class="stack">トラック<select id="target"><option value="lead">生成先</option></select></label>
              <label class="stack">モデル<select id="model"><option value="lyria-3.5">Lyria 3.5</option><option value="lyria-3-clip-preview">Lyria 3 Clip</option><option value="realtime">Lyria RealTime</option></select></label>
            </div>
            <div class="field">
              <label for="intent">フレーズ</label>
              <textarea id="intent" rows="2" placeholder="例：少し跳ねたジャズのフレーズ"></textarea>
            </div>
            <div class="control-pair">
              <label class="stack">開始小節<input id="generationStart" type="number" min="1" value="1" /></label>
              <label class="stack">長さ（小節）<input id="generationBars" type="number" min="1" max="32" value="4" /></label>
            </div>
            <div class="control-pair">
              <label class="stack">候補数<select id="candidateCount"><option value="1">1案</option><option value="2">2案</option><option value="3">3案</option><option value="4">4案</option></select></label>
              <label class="stack">並列<select id="generationConcurrency"><option value="1">順番に生成</option><option value="2">2並列</option><option value="3">3並列</option><option value="4">4並列</option></select></label>
            </div>
            <button id="ask" class="primary wide"><svg><use href="#i-spark" /></svg>生成する</button>
            <button id="demoBtn" class="text-btn wide" hidden>収録済みの2案を開く</button>
            <div class="progress" aria-hidden="true"><div id="progressBar"></div></div>
            <p id="status" class="status" aria-live="polite"></p>
          </section>

          <section id="previewPanel" class="panel preview-panel" hidden>
            <div class="preview-head"><h2>原音</h2><label><span class="sr-only">試聴する案</span><select id="previewTake" disabled><option value="0">案A</option></select></label><button id="previewStop" class="icon-btn" aria-label="試聴を停止" title="停止して先頭へ" disabled><svg><use href="#i-stop" /></svg></button></div>
            <audio id="previewAudio" controls preload="none" aria-label="生成した原音の試聴"></audio>
          </section>

          <section id="ghost" class="panel" hidden>
            <h2>提案</h2>
            <div id="alts" class="alts" role="group" aria-label="表示する案"></div>
            <p id="ghostSummary" class="hint"></p>
            <details class="spec-details"><summary>Lyria への指示</summary><div id="spec" class="spec"></div></details>
            <label class="slider" for="sens">拾う音の量 <span class="hint">少なく</span><input id="sens" type="range" min="20" max="90" value="65" /><span class="hint">多く</span></label>
            <details id="explainDetails" class="spec-details"><summary>フレーズの説明</summary><pre id="explain" class="explain"></pre></details>
            <div class="row">
              <button id="nudgeL" class="text-btn" title="提案を16分ひとつ前へ">← 1/16</button>
              <button id="nudgeR" class="text-btn" title="提案を16分ひとつ後ろへ">1/16 →</button>
              <button id="acceptAll" class="text-btn" title="表示中の案の音を全部採用（Tab）">全部採用</button>
            </div>
            <details class="note-details"><summary>メモ</summary><label class="sr-only" for="reason">採用した理由</label><textarea id="reason" rows="2"></textarea></details>
            <div class="row">
              <button id="close" class="primary">確定</button>
              <button id="discard" class="text-btn">破棄</button>
            </div>
          </section>

          <details class="panel history-panel"><summary>履歴</summary><ul id="log" class="log"></ul></details>
        </aside>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
