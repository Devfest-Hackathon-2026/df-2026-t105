<title>Ghostnotes の経緯と設計</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* レイアウト: 左に目次（広い画面だけ追従）、右に本文 1段。表とコードは横スクロールの枠に入れる */
  :root {
    --bg: #f6f7f9;
    --paper: #ffffff;
    --fg: #1b1e24;
    --muted: #5b6270;
    --line: #e0e3e9;
    --note: #2f5bd3;
    --ghost: #c8430c;
    --row: #eef1f6;
    --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121418; --paper: #181b20; --fg: #e6e8ed; --muted: #9aa1ad; --line: #2b2f37;
      --note: #8ea8ff; --ghost: #ff8a4c; --row: #1f232a; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121418; --paper: #181b20; --fg: #e6e8ed; --muted: #9aa1ad; --line: #2b2f37;
    --note: #8ea8ff; --ghost: #ff8a4c; --row: #1f232a; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--fg);
    font: 16px/1.85 var(--font-body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .page { max-width: 1120px; margin: 0 auto; padding-block: 40px 80px; display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 48px; }
  header.top { grid-column: 1 / -1; display: grid; gap: 14px; }
  .roll { width: 100%; max-width: 520px; height: auto; display: block; }
  h1 { font-size: clamp(26px, 4vw, 36px); line-height: 1.35; margin: 0; font-weight: 700; text-wrap: balance; letter-spacing: 0.01em; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: 13.5px; }
  .meta span { min-width: 0; }
  nav.toc { position: sticky; top: calc(24px + env(safe-area-inset-top, 0px)); align-self: start; font-size: 14px; }
  nav.toc p { margin: 0 0 8px; color: var(--muted); font-size: 12px; letter-spacing: 0.08em; }
  nav.toc ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; border-left: 1px solid var(--line); }
  nav.toc a { display: block; padding: 2px 0 2px 12px; color: var(--muted); text-decoration: none; line-height: 1.5; }
  nav.toc a:hover, nav.toc a:focus-visible { color: var(--fg); }
  article { min-width: 0; max-width: 780px; }
  article h2 { font-size: 22px; line-height: 1.5; margin: 56px 0 14px; padding-top: 18px; border-top: 1px solid var(--line); text-wrap: balance; }
  article h2:first-child { margin-top: 0; border-top: 0; padding-top: 0; }
  article h3 { font-size: 17.5px; margin: 32px 0 8px; }
  article p { margin: 0 0 14px; }
  article ul, article ol { margin: 0 0 16px; padding-left: 1.4em; display: grid; gap: 4px; }
  article strong { font-weight: 700; }
  article a { color: var(--note); text-underline-offset: 3px; }
  article a:focus-visible, nav.toc a:focus-visible { outline: 2px solid var(--note); outline-offset: 2px; border-radius: 2px; }
  code, .file { font-family: var(--font-mono); font-size: 0.86em; background: var(--row); border-radius: 4px; padding: 1px 5px; }
  .table-wrap { overflow-x: auto; margin: 6px 0 22px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); }
  table { border-collapse: collapse; width: 100%; font-size: 14.5px; line-height: 1.65; }
  th, td { text-align: left; vertical-align: top; padding: 9px 12px; border-bottom: 1px solid var(--line); }
  th { font-weight: 700; font-size: 13px; color: var(--muted); background: var(--row); white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  td { font-variant-numeric: tabular-nums; }
  figure.diagram { margin: 10px 0 26px; padding: 16px; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; }
  figure.diagram pre { margin: 0; }
  figure.diagram figcaption { margin-top: 10px; color: var(--muted); font-size: 13px; }
  pre.code { overflow-x: auto; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; font-size: 13px; }
  pre.code code { background: none; padding: 0; }
  @media (max-width: 860px) {
    .page { grid-template-columns: minmax(0, 1fr); gap: 28px; padding-block: 24px 56px; }
    nav.toc { position: static; }
    nav.toc ol { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); border-left: 0; }
    nav.toc a { padding-left: 0; }
  }
  @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<div class="page">
  <header class="top">
    <!-- 2小節のピアノロール。塗りが採用した音、点線の枠がゴーストノート -->
    <svg class="roll" viewBox="0 0 520 74" role="img" aria-label="ピアノロールの例。塗りつぶした音は採用した音、点線の枠は Lyria の提案を耳コピしたゴーストノート">
      <g stroke="var(--line)" stroke-width="1">
        <line x1="0" y1="0.5" x2="520" y2="0.5"/><line x1="0" y1="73.5" x2="520" y2="73.5"/>
        <line x1="0.5" y1="0" x2="0.5" y2="74"/><line x1="260" y1="0" x2="260" y2="74"/><line x1="519.5" y1="0" x2="519.5" y2="74"/>
        <line x1="65" y1="0" x2="65" y2="74" opacity=".5"/><line x1="130" y1="0" x2="130" y2="74" opacity=".5"/><line x1="195" y1="0" x2="195" y2="74" opacity=".5"/>
        <line x1="325" y1="0" x2="325" y2="74" opacity=".5"/><line x1="390" y1="0" x2="390" y2="74" opacity=".5"/><line x1="455" y1="0" x2="455" y2="74" opacity=".5"/>
      </g>
      <g fill="var(--note)">
        <rect x="3" y="44" width="30" height="8" rx="2"/><rect x="36" y="36" width="14" height="8" rx="2"/>
        <rect x="68" y="28" width="46" height="8" rx="2"/><rect x="133" y="36" width="30" height="8" rx="2"/>
        <rect x="166" y="44" width="14" height="8" rx="2"/><rect x="198" y="52" width="58" height="8" rx="2"/>
      </g>
      <g fill="none" stroke="var(--ghost)" stroke-width="1.5" stroke-dasharray="3 2.5">
        <rect x="263.5" y="44.5" width="29" height="7" rx="2"/><rect x="296.5" y="36.5" width="13" height="7" rx="2"/>
        <rect x="328.5" y="28.5" width="29" height="7" rx="2"/><rect x="361.5" y="20.5" width="13" height="7" rx="2"/>
        <rect x="393.5" y="28.5" width="45" height="7" rx="2"/><rect x="458.5" y="12.5" width="57" height="7" rx="2"/>
      </g>
    </svg>
    <h1>{{TITLE}}</h1>
    <div class="meta">{{META}}</div>
  </header>
  <nav class="toc" aria-label="目次">
    <p>目次</p>
    <ol>{{TOC}}</ol>
  </nav>
  <article>
{{BODY}}
  </article>
</div>
